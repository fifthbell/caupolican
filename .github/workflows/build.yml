name: Build and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: caupolican-deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: [self-hosted, linux, x64, helix]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # The image is built on the runner and shipped to the application host as
      # an artifact, so no registry credential is involved in the deployment.
      - name: Build immutable image
        run: |
          docker build \
            --build-arg BUILD_VERSION=${{ github.sha }} \
            -t ghcr.io/${{ github.repository }}:${{ github.sha }} .

      - name: Export immutable image
        run: docker save --output caupolican-image.tar ghcr.io/${{ github.repository }}:${{ github.sha }}

      - name: Upload image for deployment
        uses: actions/upload-artifact@v4
        with:
          name: caupolican-image-${{ github.sha }}
          path: caupolican-image.tar
          if-no-files-found: error
          retention-days: 1

  deploy:
    runs-on: [self-hosted, linux, x64, helix]
    needs: build

    steps:
      - name: Download image for deployment
        uses: actions/download-artifact@v4
        with:
          name: caupolican-image-${{ github.sha }}
          path: deployment

      - name: Copy image to application host
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: deployment/caupolican-image.tar
          target: /tmp/caupolican-${{ github.sha }}
          strip_components: 1

      - name: Deploy Caupolican to application host
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            sh -c '
            set -eu

            if [ -z "${{ secrets.ROUTER_TOKEN }}" ]; then
              echo "Missing required GitHub secret: ROUTER_TOKEN"
              exit 1
            fi
            docker info >/dev/null

            IMAGE="ghcr.io/${{ github.repository }}:${{ github.sha }}"
            TRANSFER_DIR="/tmp/caupolican-${{ github.sha }}"
            docker load --input "$TRANSFER_DIR/caupolican-image.tar"

            deployment_ok=false
            rollback() {
              if [ "$deployment_ok" != true ]; then
                docker logs --tail 200 caupolican 2>&1 || true
                docker rm -f caupolican >/dev/null 2>&1 || true
                if docker inspect caupolican-previous >/dev/null 2>&1; then
                  docker rename caupolican-previous caupolican
                  docker start caupolican >/dev/null
                fi
              fi
            }
            trap rollback EXIT

            docker rm -f caupolican-previous >/dev/null 2>&1 || true
            if docker inspect caupolican >/dev/null 2>&1; then
              docker stop caupolican >/dev/null
              docker rename caupolican caupolican-previous
            fi

            mkdir -p /tmp/caupolican/out

            docker run -d --name caupolican \
              -e TARGET_DURATION=2 \
              -e WINDOW_SEGMENTS=15 \
              -e STANDBY_TEXT="Caupolican — Standby" \
              -e CHANNELS="news,sports" \
              -e OUT_ROOT="/out" \
              -e ROUTER_TOKEN="${{ secrets.ROUTER_TOKEN }}" \
              -v /tmp/caupolican/out:/out \
              -p 9999:9999 \
              --ulimit nofile=65536:65536 \
              --restart=always \
              --log-driver=local \
              --log-opt max-size=10m \
              --log-opt max-file=3 \
              "$IMAGE"

            for attempt in $(seq 1 45); do
              if docker exec caupolican curl -fsS http://127.0.0.1:9999/api/health >/dev/null; then
                break
              fi
              sleep 2
            done
            docker exec caupolican curl -fsS http://127.0.0.1:9999/api/health >/dev/null

            deployment_ok=true
            docker rm -f caupolican-previous >/dev/null 2>&1 || true
            rm -f "$TRANSFER_DIR/caupolican-image.tar"
            rmdir "$TRANSFER_DIR"
            echo "deployment completed for ${{ github.sha }}"
            '
